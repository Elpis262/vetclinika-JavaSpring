<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Виды животных</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="sidebar">
        <ul class="menu">
            <li><a href="/admin">Главная</a></li>
            <li><a href="/pets">Питомцы</a></li>
            <li><a href="/vets">Врачи</a></li>
            <li><a href="/appointments">Записи</a></li>
            <li><a href="/users">Пользователи</a></li>
            <li><a href="/users/manage-roles">Управление ролями</a></li>
            <li><a href="/roles">Роли</a></li>
            <li><a href="/specialities">Специальностей</a></li>
            <li><a href="/species" class="active">Виды животных</a></li>
            <li><a href="/breeds">Породы</a></li>
            <li><a href="/services">Услуги</a></li>
            <li><a href="/prescriptions">Назначения</a></li>
        </ul>
    </div>

    <div class="content">
        <div class="topbar">
            <h2>Виды животных</h2>
            <div class="user-profile">Администратор</div>
        </div>

        <div class="table-container">
            <div class="search-container">
                <form th:action="@{/species/search}" method="get">
                    <input type="text" name="keyword" placeholder="Поиск по названию или ID" th:value="${keyword}">
                    <button type="submit" class="add-btn">Найти</button>
                </form>
            </div>
            <h3>Список видов</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Вид</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="specy : ${species}">
                        <td th:text="${specy.id}">1</td>
                        <td th:text="${specy.name}">Кот</td>
                        <td class="action-buttons">
                            <a th:href="@{/species/edit/{id}(id=${specy.id})}" class="btn-edit">Изменить</a>
                            <a th:href="@{/species/delete/{id}(id=${specy.id})}" class="btn-delete">Удалить</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="form-container">
            <h3>Добавить вид</h3>
            <form th:action="@{/species/save}" th:object="${specy}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="field">
                    <label>Вид животного</label>
                    <input type="text" th:field="*{name}" placeholder="Кот">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
                </div>
                <div class="buttons">
                    <button type="submit" class="add-btn">Сохранить</button>
                    <a href="/species" class="button-action">Очистить</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
