<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Услуги</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="sidebar">
        <ul class="menu">
            <li><a href="/admin">Главная</a></li>
            <li><a href="/pets">Питомцы</a></li>
            <li><a href="/vets">Врачи</a></li>
            <li><a href="/appointments">Записи</a></li>
            <li><a href="/users">Пользователи</a></li>
            <li><a href="/users/manage-roles">Управление ролями</a></li>
            <li><a href="/roles">Роли</a></li>
            <li><a href="/specialities">Специальностей</a></li>
            <li><a href="/species">Виды животных</a></li>
            <li><a href="/breeds">Породы</a></li>
            <li><a href="/services" class="active">Услуги</a></li>
            <li><a href="/prescriptions">Назначения</a></li>
        </ul>
    </div>

    <div class="content">
        <div class="topbar">
            <h2>Услуги</h2>
            <div class="user-profile">Администратор</div>
        </div>

        <div class="table-container">
            <div class="search-container">
                <form th:action="@{/services/search}" method="get">
                    <input type="text" name="keyword" placeholder="Поиск по названию или ID" th:value="${keyword}">
                    <button type="submit" class="add-btn">Найти</button>
                </form>
            </div>
            <h3>Список услуг</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="service : ${services}">
                        <td th:text="${service.id}">1</td>
                        <td th:text="${service.name}">Консультация</td>
                        <td th:text="${service.price}">1000.00</td>
                        <td class="action-buttons">
                            <a th:href="@{/services/edit/{id}(id=${service.id})}" class="btn-edit">Изменить</a>
                            <a th:href="@{/services/delete/{id}(id=${service.id})}" class="btn-delete">Удалить</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="form-container">
            <h3>Добавить услугу</h3>
            <form th:action="@{/services/save}" th:object="${service}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="field">
                    <label>Название</label>
                    <input type="text" th:field="*{name}" placeholder="Консультация">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
                </div>
                <div class="field">
                    <label>Цена</label>
                    <input type="text" th:field="*{price}" placeholder="1000.00">
                    <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="error"></span>
                </div>
                <div class="buttons">
                    <button type="submit" class="add-btn">Сохранить</button>
                    <a href="/services" class="button-action">Очистить</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
