<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>🐾 Paw Care</h2>
            <h3>Регистрация</h3>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="field">
                    <label>Логин</label>
                    <input type="text" th:field="*{username}" placeholder="new_user">
                    <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="error"></span>
                </div>
                <div class="field">
                    <label>Пароль</label>
                    <input type="password" th:field="*{password}" placeholder="••••••">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></span>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="text" th:field="*{email}" placeholder="email@mail.com">
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></span>
                </div>
                <div class="field">
                    <label>Телефон</label>
                    <input type="text" th:field="*{phone}" placeholder="+7-900-123-45-67">
                    <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="error"></span>
                </div>
                <div class="buttons">
                    <button type="submit" class="add-btn">Зарегистрироваться</button>
                </div>
                <p style="margin-top: 15px; text-align: center;">
                    Уже есть аккаунт? <a href="/login" style="color: #a44e6c;">Войти</a>
                </p>
                <p style="margin-top: 10px; text-align: center;">
                    <a href="/" style="color: #a44e6c;">← Вернуться на главную</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
